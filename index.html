<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="description" content="Success AI — one workspace to chat, create images, videos, music, documents, websites and apps.">
<title>Success AI — Create Anything</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><div class="logo">S</div><div>Success AI<small>CREATE ANYTHING</small></div></div>

    <button class="btn primary" id="nav-new-project" type="button" style="margin:0 4px 8px">＋ New Project</button>

    <button class="nav-item" data-view="home"><span class="ico">⌂</span>Home</button>
    <button class="nav-item" data-view="chat"><span class="ico">✦</span>AI Chat</button>
    <button class="nav-item" data-view="explore"><span class="ico">✧</span>Explore</button>
    <button class="nav-item" data-view="projects"><span class="ico">▣</span>My Projects</button>

    <div class="nav-group">CREATIVE STUDIOS</div>
    <button class="nav-item" data-view="image"><span class="ico">▧</span>Image Studio</button>
    <button class="nav-item" data-view="video"><span class="ico">▶</span>Video Studio</button>
    <button class="nav-item" data-view="music"><span class="ico">♫</span>Music Studio</button>
    <button class="nav-item" data-view="documents"><span class="ico">▤</span>Document Studio</button>

    <div class="nav-group">BUILD</div>
    <button class="nav-item" data-view="website"><span class="ico">◎</span>Website Builder</button>
    <button class="nav-item" data-view="app"><span class="ico">⌘</span>App Builder</button>
    <button class="nav-item" data-view="devlab"><span class="ico">⟨⟩</span>Developer Lab</button>

    <div class="nav-group">LIBRARY</div>
    <button class="nav-item" data-view="characters"><span class="ico">☺</span>Character Library</button>
    <button class="nav-item" data-view="assets"><span class="ico">▦</span>Asset Library</button>
    <button class="nav-item" data-view="templates"><span class="ico">❖</span>Templates</button>
    <button class="nav-item" data-view="history"><span class="ico">↺</span>History</button>
    <button class="nav-item" data-view="settings"><span class="ico">⚙</span>Settings</button>

    <div class="sidebar-foot">
      <button class="sync-pill btn ghost" id="sync-pill" type="button" style="width:100%;justify-content:flex-start">
        <span class="dot" id="sync-dot"></span><span id="sync-text">Starting…</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn icon menu-btn" id="menu-btn" type="button" aria-label="Open menu">☰</button>
      <div>
        <div class="kicker" id="view-kicker">SUCCESS AI</div>
        <h1 id="view-title">Home</h1>
      </div>
      <div class="spacer"></div>
      <button class="project-chip" id="project-chip" type="button">No project selected</button>
      <button class="btn sm ghost" id="account-btn" type="button">Sign in</button>
    </header>
    <main id="views"></main>
  </div>
</div>

<noscript><p style="padding:20px">Success AI needs JavaScript enabled.</p></noscript>

<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/platform.js"></script>
<script src="js/chat.js"></script>
<script src="js/image.js"></script>
<script src="js/video.js"></script>
<script src="js/music.js"></script>
<script src="js/documents.js"></script>
<script src="js/build.js"></script>
<script src="js/library.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
